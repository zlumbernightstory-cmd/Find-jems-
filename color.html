<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Jems | Colour Customization</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background-color: #ffe6f2;
      font-family: "Poppins", sans-serif;
      color: #333;
      margin: 0;
      text-align: center;
    }

    header {
      background-color: #ffb6c1;
      padding: 15px;
      font-size: 26px;
      font-weight: bold;
      color: white;
      border-bottom: 3px solid #ff80ab;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      background: #ff5ca8;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 25px;
      margin: 5px;
      display: inline-block;
      font-weight: 500;
    }

    nav a:hover {
      background: #ff3385;
    }

    .color-section {
      margin: 30px auto;
      padding: 20px;
      background: white;
      width: 90%;
      max-width: 600px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(255, 128, 171, 0.3);
    }

    h2 {
      color: #d63384;
    }

    .color-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .color {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, border 0.2s;
    }

    .color:hover {
      transform: scale(1.1);
      border: 3px solid #ff80ab;
    }

    .selected {
      border: 3px solid #ff4081 !important;
    }

    button {
      margin-top: 25px;
      padding: 12px 25px;
      background-color: #ff5ca8;
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #ff3385;
    }

    footer {
      background: #ffb6c1;
      padding: 15px;
      color: white;
      font-size: 14px;
      margin-top: 40px;
      border-top: 2px solid #ff80ab;
    }
  </style>
</head>
<body>

  <header>Find Jems</header>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="order.html">Order</a>
    <a href="color.html">Customize</a>
  </nav>

  <div class="color-section">
    <h2>🎀 Choose Your Gem Colour 🎀</h2>
    <p>Select your favourite colour theme for your jewellery.</p>

    <div class="color-options">
      <div class="color" style="background-color: #ffc1cc;" data-name="Baby Pink"></div>
      <div class="color" style="background-color: #f8bbd0;" data-name="Soft Rose"></div>
      <div class="color" style="background-color: #f48fb1;" data-name="Blush Pink"></div>
      <div class="color" style="background-color: #e1bee7;" data-name="Lavender Dream"></div>
      <div class="color" style="background-color: #ce93d8;" data-name="Lilac"></div>
      <div class="color" style="background-color: #fce4ec;" data-name="Peach Blossom"></div>
      <div class="color" style="background-color: #fff0f5;" data-name="Cotton Candy"></div>
      <div class="color" style="background-color: #ffd1dc;" data-name="Cherry Blossom"></div>
    </div>

    <button id="confirmBtn">Confirm Selection</button>
  </div>

  <footer>© 2025 Find Jems. All rights reserved.</footer>

  <script>
    const colors = document.querySelectorAll(".color");
    let selectedColor = null;

    colors.forEach(color => {
      color.addEventListener("click", () => {
        colors.forEach(c => c.classList.remove("selected"));
        color.classList.add("selected");
        selectedColor = color.dataset.name;
      });
    });

    document.getElementById("confirmBtn").addEventListener("click", () => {
      if (!selectedColor) {
        alert("Please select a color before confirming 🎨");
        return;
      }
      const msg = `🌸 New Color Customization Request 🌸%0A%0A🎀 Color: ${selectedColor}%0AFrom Find Jems Customization Page 💕`;
      window.open(`https://wa.me/?text=${msg}`, "_blank");
    });
  </script>

</body>
</html>
