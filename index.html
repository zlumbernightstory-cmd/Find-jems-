<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome | Find Jems</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      color: #333;
      overflow-x: hidden;
      background:
      linear-gradient(to bottom right, rgba(255, 230, 240, 0.85), rgba(255, 214, 235, 0.85)),
      url("findjems-logo-pink.jpg") center/50% no-repeat fixed;
      background-blend-mode: lighten;
    }

    /* 🌸 Navigation Bar (hidden from view but for spacing aesthetic) */
    nav {
      height: 60px;
      background-color: transparent;
    }

    /* 🌸 Hero Section */
    .hero {
      min-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    .hero h1 {
      color: #d63384;
      font-size: 2.8em;
      background: rgba(255, 255, 255, 0.8);
      padding: 15px 35px;
      border-radius: 25px;
      box-shadow: 0 4px 12px rgba(214, 51, 132, 0.2);
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 1.2em;
      color: #555;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.7);
      padding: 12px 20px;
      border-radius: 15px;
      margin-bottom: 30px;
    }

    .hero a.button {
      display: inline-block;
      background-color: #d63384;
      color: white;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 30px;
      font-weight: 500;
      font-size: 1em;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(214, 51, 132, 0.3);
    }

    .hero a.button:hover {
      background-color: #b52d6f;
      transform: scale(1.05);
      box-shadow: 0 6px 14px rgba(214, 51, 132, 0.4);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 0.9em;
      background: rgba(255, 255, 255, 0.6);
    }

    /* 🌸 Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero h1, .hero p, .hero a.button {
      animation: fadeIn 1s ease forwards;
    }
  </style>
</head>
<body>

  <nav></nav>

  <section class="hero">
    <h1>Welcome to Find Jems ✨</h1>
    <p>Where Beauty Meets Elegance Discover Handmade Jewellery and Self-care Treasures That Let Your True Sparkle Shine </p>
    <a href="explore.html" class="button">Explore Now 🛍️</a>
  </section>

  <footer>
    © 2025 Find Jems | All Rights Reserved.🌸
  </footer>

</body>
</html>
