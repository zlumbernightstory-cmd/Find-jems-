<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Jems - Custom Order</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #fff0f5;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h2 {
      color: #d63384;
    }

    form {
      max-width: 400px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-family: "Poppins", sans-serif;
      margin-bottom: 15px;
    }

    button {
      background-color: #d63384;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    button:hover {
      background-color: #b52d6f;
    }

    #qrSection {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    #qrSection img {
      width: 200px;
      border-radius: 10px;
    }

    small {
      color: #777;
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <section class="order-section">
    <h2>Thank You for Shopping with Find Jems 💕</h2>
    <p>Fill in the details below to complete your order ✨</p>

    <form id="whatsappOrderForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email address" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="Enter your phone number" required>

      <label for="address">Delivery Address</label>
      <textarea id="address" placeholder="Enter your full delivery address" required></textarea>

      <label for="design">If Any Question Ask?</label>
      <textarea id="design" placeholder="Describe your design or customization details" required></textarea>

      <label for="payment">Payment Method:</label>
      <select id="payment" onchange="toggleQR()" required>
        <option value="">-- Select Payment Method --</option>
        <option value="online">Online Payment</option>
        <option value="cod">Cash on Delivery</option>
      </select>

      <div id="qrSection">
        <h3 style="color:#d63384;">💖 Scan to Pay 💖</h3>
        <img src="findjems-payment-qr.jpg" alt="Find Jems UPI QR Code">
        <small>After payment, take a screenshot and attach it in WhatsApp 📸</small>
      </div>

      <button type="button" onclick="sendToWhatsApp()">Submit via WhatsApp</button>
    </form>
  </section>

  <script>
    function toggleQR() {
      const payment = document.getElementById("payment").value;
      const qrSection = document.getElementById("qrSection");
      qrSection.style.display = (payment === "online") ? "block" : "none";
    }

    function sendToWhatsApp() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();
      const design = document.getElementById("design").value.trim();
      const payment = document.getElementById("payment").value;

      if (!name || !email || !phone || !address || !design || !payment) {
        alert("Please fill in all required fields before submitting 💖");
        return;
      }

      const whatsappNumber = "919233587954"; // Replace with your WhatsApp number

      let message =
        `🌸 *New Order from Find Jems* 🌸\n\n` +
        `👩 *Name:* ${name}\n` +
        `📧 *Email:* ${email}\n` +
        `📞 *Phone:* ${phone}\n` +
        `🏠 *Address:* ${address}\n` +
        `🎨 *Design Details:* ${design}\n` +
        `💰 *Payment Method:* ${payment === "online" ? "Online Payment (Paid via UPI)" : "Cash on Delivery"}\n\n` +
        `✨ Thank you for your order with *Find Jems*! 💕\n` +
        `📎 Please attach the image of your ordered product below.`;

      // Extra note if payment is online
      if (payment === "online") {
        message += `\n💸 Also attach your payment screenshot for confirmation.`;
      }

      const encodedMessage = encodeURIComponent(message);
      const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
      window.open(whatsappURL, "_blank");
    }
  </script>

</body>
</html>
  </script>

</body>
</html>;

  </script>

</body>
</html>
