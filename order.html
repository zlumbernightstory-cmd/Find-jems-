<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Jems | Order</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Find Jems</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="order.html" class="active">Order</a>
    </nav>
  </header>

  <section class="content">
    <h2>Place Your Custom Order</h2>
    <p>Fill in the details below to create your personalized jewellery order. We’ll contact you soon to confirm your design!</p>

    <form class="order-form" onsubmit="event.preventDefault(); alert('Thank you for your order! We’ll contact you soon.');">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

      <label for="gem">Choose Gemstone</label>
      <select id="gem" name="gem" required>
        <option value="">Select a gemstone</option>
        <option value="morganite">Morganite</option>
        <option value="pearl">Pearl</option>
        <option value="tourmaline">Tourmaline</option>
        <option value="emerald">Emerald</option>
      </select>

      <label for="details">Design Details</label>
      <textarea id="details" name="details" placeholder="Describe your custom design..." rows="4" required></textarea>

      <button type="submit" class="btn">Submit Order</button>
    </form>
  </section>

  <footer>
    <p>© 2025 Find Jems. All rights reserved.</p>
  </footer>
</body>
</html>
