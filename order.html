<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Jems - Custom Order</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #fff0f5;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h2 {
      color: #d63384;
    }

    form {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-family: "Poppins", sans-serif;
    }

    button {
      background-color: #d63384;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    button:hover {
      background-color: #b52d6f;
    }

    #qrSection {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    #qrSection img {
      width: 250px;
      border-radius: 10px;
    }

    small {
      color: #777;
      display: block;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <section class="order-section">
    <h2>Thankyou For Shopping With Us</h2>
    <p>Fill in the details below to complete your Order ✨</p>

    <form id="whatsappOrderForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email address" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="Enter your phone number" required>

      <label for="address">Delivery Address</label>
      <textarea id="address" placeholder="Enter your full delivery address" required></textarea>

      <label for="design">If Any Question Ask?</label>
      <textarea id="design" placeholder="Describe your design or customization details" required></textarea>

      <label for="imageUpload">Upload Your order Image</label>
      <input type="file" id="imageUpload" accept="image/*">

      <label for="payment">Payment Method:</label>
      <select id="payment" name="payment" onchange="toggleQR()" required>
        <option value="">-- Select Payment Method --</option>
        <option value="online">Online Payment</option>
        <option value="cod">Cash on Delivery</option>
      </select>

      <div id="qrSection">
        <h3 style="color:#d63384;">💖 Scan to Pay 💖</h3>
        <<img src="findjems-payment-qr.jpg" alt="Find Jems UPI QR Code">
        <p style="margin-top:10px; color:#555;">UPI ID: <b>moalemlalemtur4-2@okicici</b></p>
        <small>After payment, take a screenshot and attach it in WhatsApp 📸</small>
      </div>

      <button type="button" onclick="sendToWhatsApp()">Submit via WhatsApp</button>
    </form>
  </section>

  <script>
    function toggleQR() {
     <input type="file" id="imageUpload" accept="image/*">
     <img id="previewImage" style="display:none; margin-top:10px; max-width:200px; border-radius:10px;">
       const payment = document.getElementById("payment").value;
      const qrSection = document.getElementById("qrSection");
      qrSection.style.display = (payment === "online") ? "block" : "none";
    }

    function sendToWhatsApp() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();
      const design = document.getElementById("design").value.trim();
      const payment = document.getElementById("payment").value;
      const imageUpload = document.getElementById("imageUpload").value;

      if (!name || !email || !phone || !address || !design || !payment) {
        alert("Please fill in all required fields before submitting 💖");
        return;
      }

      const encodedMessage = encodeURIComponent(
        `🌸 *New Order from Find Jems.My beauty Larlo got new order Yay!* 🌸\n\n` +
        `👩 Name: ${name}\n` +
        `📧 Email: ${email}\n` +
        `📞 Phone: ${phone}\n` +
        `🏠 Address: ${address}\n` +
        `🎨 Design Details: ${design}\n` +
        `💰 Payment Method: ${payment === "online" ? "Online Payment (Paid via UPI)" : "Cash on Delivery"}\n` +
        `${imageUpload ? "🖼️ Image uploaded: Yes\n" : ""}` +
        `\n✨ Please confirm my order.`
      );

      const whatsappNumber = "919233587954"; // Replace with your WhatsApp number (with country code, no +)
      const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

      window.open(whatsappURL, "_blank");
    }
  </script>

</body>
</html>
